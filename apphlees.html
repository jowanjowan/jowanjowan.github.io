<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MainConnect TV Channels</title>
<link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: #fff;
  }

  /* Video Player */
  .video-container {
    width: 100%;
    max-width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
  }
  .video-js {
    width: 100%;
    height: 100%;
  }

  /* Channel Grid */
  .channel-grid {
    display: grid;
    gap: 10px;
    padding: 10px;
  }
  @media (orientation: portrait) {
    .channel-grid {
      grid-template-columns: 1fr;
    }
  }
  @media (orientation: landscape) {
    .channel-grid {
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    }
  }

  /* Channel Cards */
  .channel-card {
    background: #222;
    padding: 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.2s ease;
    text-align: center;
  }
  .channel-card:hover {
    transform: scale(1.05);
  }
  .channel-card.active {
    outline: 2px solid #ff9900;
  }
</style>
</head>
<body>

<div class="video-container">
  <video id="hlsPlayer" class="video-js vjs-default-skin" controls preload="auto"></video>
</div>

<h2 id="channel-title" style="padding: 10px;">Select a Channel</h2>

<div class="channel-grid">
  <div class="channel-card" onclick="playStream(this, 'Channel 1', 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8')">
    Channel 1
  </div>
  <div class="channel-card" onclick="playStream(this, 'Channel 2', 'https://moctv.live/hls/stream2.m3u8')">
    Channel 2
  </div>
</div>

<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script>
  const player = videojs('hlsPlayer');

  function playStream(card, title, url) {
    document.querySelectorAll('.channel-card').forEach(c => c.classList.remove('active'));
    card.classList.add('active');
    document.getElementById('channel-title').innerText = title;
    player.src({ src: url, type: 'application/x-mpegURL' });
    player.play();
  }

  function isMobile() {
    return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
  }

  window.addEventListener('orientationchange', () => {
    let videoContainer = document.querySelector('.video-container');

    if (window.matchMedia("(orientation: landscape)").matches) {
      if (isMobile()) {
        // Try native fullscreen
        if (videoContainer.requestFullscreen) {
          videoContainer.requestFullscreen();
        } else {
          // Fallback: simulated fullscreen
          videoContainer.style.position = 'fixed';
          videoContainer.style.top = '0';
          videoContainer.style.left = '0';
          videoContainer.style.width = '100%';
          videoContainer.style.height = '100%';
          videoContainer.style.zIndex = '9999';
          videoContainer.style.background = '#000';
        }
      }
    } else {
      // Exit fullscreen or reset
      if (document.exitFullscreen) {
        document.exitFullscreen();
      }
      videoContainer.removeAttribute('style');
    }
  });
</script>
</body>
</html>
