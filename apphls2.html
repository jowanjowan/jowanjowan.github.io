<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MainConnect TV2 Player</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <style>
    body {
      background-color: #1e1e2f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 2rem;
      text-align: center;
    }
    .player-container {
      max-width: 720px;
      margin: 2rem auto;
    }
    select {
      padding: 0.6rem;
      font-size: 1rem;
      margin-top: 1rem;
      width: 300px;
    }
  </style>
</head>
<body>
  <h1>MainConnect TV Selector</h1>

  <div class="player-container">
    <video id="hlsPlayer" class="video-js vjs-default-skin" controls preload="auto" width="720" height="405"></video>
  </div>

  <label for="tvSelector">Select a Channel:</label><br />
  <select id="tvSelector">
    <option value="">-- Choose a Channel --</option>
    <option value="http://broadcast2.mainconnect.co.ke:8080/tmp_hls/mbcitv/index.m3u8">MBCI TV</option>
    <option value="http://broadcast2.mainconnect.co.ke:8080/tmp_hls/chosen/index.m3u8">Chosen TV</option>
    <option value="http://broadcast2.mainconnect.co.ke:8080/tmp_hls/impact/index.m3u8">Impact TV</option>
    <!-- Add more channels here -->
  </select>

  <script>
    const player = videojs('hlsPlayer');

    document.getElementById('tvSelector').addEventListener('change', function () {
      const url = this.value;
      if (url) {
        player.src({ type: 'application/x-mpegURL', src: url });
        player.play();
      } else {
        player.pause();
        player.src('');
      }
    });
  </script>
</body>
</html>
