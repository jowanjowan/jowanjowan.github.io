<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MainConnect TV Channels</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #player-wrapper {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-js {
      width: 100%;
      height: 100%;
    }

    #now-playing {
      width: 100%;
      max-width: 600px;
      background-color: #222;
      text-align: center;
      font-size: 1rem;
      padding: 0.5rem;
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
    }

    #channel-scroll {
      flex: 1;
      width: 100%;
      max-width: 630px;
      overflow-y: auto;
      padding: 1rem;
    }

 #channel-scroll::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
	
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 1rem;
    }

    .channel-card {
      background: #222;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border 0.2s;
      border: 2px solid transparent;
    }

    .channel-card:hover {
      transform: scale(1.05);
    }

    .channel-card.active {
      border: 2px solid #8b5cf6;
      box-shadow: 0 0 10px #8b5cf6;
    }

    .channel-thumbnail {
      width: 100%;
      height: 80px;
      object-fit: cover;
    }

    .channel-name {
      padding: 0.5rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div id="main-container">

    <!-- Video Player -->
    <div id="player-wrapper">
      <video id="hlsPlayer" class="video-js vjs-default-skin" controls preload="auto"></video>
    </div>

    <!-- Now Playing -->
    <div id="now-playing">Now Playing: <span id="channel-title">None</span></div>

    <!-- Channel List -->
    <div id="channel-scroll">
      <div class="channel-grid">
        <!-- All your channel cards go here as-is -->
        <!-- Example: -->
         <!-- MBCI TV -->
        <div class="channel-card" onclick="playStream(this, 'MBCI TV', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/mbcitv/index.m3u8')">
          <img src="https://play-lh.googleusercontent.com/_v67cT93M4LVasv2ynCit64sKo_gz4ji5tu_5LemiuqltJrE1DkcCFohDSB_wxCRzH_K=w600-h300-pc0xffffff-pd"
               alt="MBCI TV" class="channel-thumbnail" />
          <div class="channel-name">MBCI TV</div>
        </div>

        <!-- Chosen TV -->
        <div class="channel-card" onclick="playStream(this, 'Chosen TV', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/mainconnecttv/index.m3u8')">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS7KpwzHtRGsupJmTwpAxyavPsskcMuqsn5Hw&s"
               alt="Chosen TV" class="channel-thumbnail" />
          <div class="channel-name">Chosen TV</div>
        </div>

        <!-- Oracle TV -->
        <div class="channel-card" onclick="playStream(this, 'Oracle TV', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/oracletv/index.m3u8')">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSKIEGfXduLHWWEaQAowKHhD8pREzSWgjwu8A&s"
               alt="Oracle TV" class="channel-thumbnail" />
          <div class="channel-name">Oracle TV</div>
        </div>

        <!-- Ndisi TV -->
        <div class="channel-card" onclick="playStream(this, 'Ndisi TV', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/ndisitv/index.m3u8')">
          <img src="https://yt3.googleusercontent.com/G24htR8iQlxcx7T6cXiHqATqQV6an2WSKoJe6eBt5AiPP49Y_b1dM7_JN-sA1HjPlNyjoOWuQlI=s900-c-k-c0x00ffffff-no-rj"
               alt="Ndisi TV" class="channel-thumbnail" />
          <div class="channel-name">Ndisi TV</div>
        </div>

        <!-- Riri TV -->
        <div class="channel-card" onclick="playStream(this, 'Riri TV', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/riritvnakuru/index.m3u8')">
          <img src="https://yt3.googleusercontent.com/ytc/AIdro_mTkMQAU88JEK2O2bCpCuEBmDeKVPzLEhks6CTMxhcKqQA=s160-c-k-c0x00ffffff-no-rj"
               alt="Riri TV" class="channel-thumbnail" />
          <div class="channel-name">Riri TV</div>
        </div>
		
		<!-- Oracle TV -->
        <div class="channel-card" onclick="playStream(this, 'Faith TV', 'https://cdn.freevisiontv.co.za/sttv/smil:faith.stream.smil/playlist.m3u8')">
          <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQVQeCzLp_2KhIN-r4df9n2ifj3BhLpQUAOQ&s"
               alt="Faith tv" class="channel-thumbnail" />
          <div class="channel-name">Faith Tv</div>
        </div>

        <!-- Ndisi TV -->
        <div class="channel-card" onclick="playStream(this, 'katv', 'http://broadcast.mainconnect.co.ke:8080/tmp_hls/katv/index.m3u8')">
          <img src="https://www.facebook.com/photo/?fbid=122093237516028910&set=a.122093233352028910"
               alt="katv" class="channel-thumbnail" />
          <div class="channel-name">ka tv</div>
        </div>
		
		<!-- MBCI TV -->
        <div class="channel-card" onclick="playStream(this, 'Cloudflare Stream', 'https://cloudflare.tv/hls/live.m3u8')">
          <img src="https://cdn-1.webcatalog.io/catalog/cloudflare-tv/cloudflare-tv-icon.png?v=1714781663764"
               alt="Cloudflare Stream " class="channel-thumbnail" />
          <div class="channel-name">Cloudflare Stream </div>
        </div>

        <!-- Chosen TV -->
        <div class="channel-card" onclick="playStream(this, 'citizen extra', 'https://74937-castr.akamaized.net/5ea49827ff3b5d7b22708777/live_cd93fa8063f411ecb28b5d4f40b51a46/index.m3u8')">
          <img src="https://i.imgur.com/16d8NJd.jpg"
               alt="citizen extra" class="channel-thumbnail" />
          <div class="channel-name">citizen extra</div>
        </div>

        <!-- Oracle TV -->
        <div class="channel-card" onclick="playStream(this, 'africatv', 'http://africatv.live.net.sa:1935/live/africatv2/playlist.m3u8')">
          <img src="https://yt3.googleusercontent.com/ytc/AIdro_kcG7Hf4z6oK8yzeomCwKUaHSjTEin1NqTDZqVrUhbvew=s900-c-k-c0x00ffffff-no-rj"
               alt="africatv" class="channel-thumbnail" />
          <div class="channel-name">africatv</div>
        </div>

        <!-- Ndisi TV -->
        <div class="channel-card" onclick="playStream(this, 'ga-ksaports1', 'https://live20.bozztv.com/gin-36bay3/ga-ksaports1/index.m3u8')">
          <img src="https://www.gasports.ie/wp-content/uploads/2018/10/GA-Sports-Square-logo.png"
               alt="ga-ksaports1" class="channel-thumbnail" />
          <div class="channel-name">ga-ksaports1</div>
        </div>

        <!-- Riri TV -->
        <div class="channel-card" onclick="playStream(this, 'womens-sports', 'https://apollo.production-public.tubi.io/live/ac-fast-studios-womens-sports.m3u8')">
          <img src="https://cdn.mos.cms.futurecdn.net/JCaC8uwG2WTpG3WCRHdJih.jpg"
               alt="womens-sportsV" class="channel-thumbnail" />
          <div class="channel-name">womens-sports</div>
        </div>
        <!-- (copy the rest of your channel cards here) -->
      </div>
    </div>
  </div>

  <script>
    const player = videojs('hlsPlayer');
    const nowPlayingTitle = document.getElementById("channel-title");

    function playStream(element, name, url) {
      player.src({ type: 'application/x-mpegURL', src: url });
      player.play();
      nowPlayingTitle.textContent = name;

      document.querySelectorAll(".channel-card").forEach(card =>
        card.classList.remove("active")
      );
      element.classList.add("active");
    }
  </script>

</body>
</html>
