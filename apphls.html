<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>MainConnect TV Channels</title>
  <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
    }

    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    #player-wrapper {
      width: 100%;
      max-width: 640px;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    .video-js {
      width: 100%;
      height: 100%;
    }

    #now-playing {
      width: 100%;
      max-width: 600px;
      background-color: #222;
      text-align: center;
      font-size: 1rem;
      padding: 0.5rem;
      border-top: 1px solid #444;
      border-bottom: 1px solid #444;
    }

    #channel-scroll {
      flex: 1;
      width: 100%;
      max-width: 630px;
      overflow-y: auto;
      padding: 1rem;
    }

 #channel-scroll::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }
	
    .channel-grid {
      display: grid;
      grid-template-columns: repeat(5, minmax(50px, 1fr));
      gap: 1rem;
    }

    .channel-card {
      background: #222;
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border 0.2s;
      border: 2px solid transparent;
    }

    .channel-card:hover {
      transform: scale(1.05);
    }

    .channel-card.active {
      border: 2px solid #8b5cf6;
      box-shadow: 0 0 10px #8b5cf6;
    }

    .channel-thumbnail {
      width: 100%;
      height: 40px;
      object-fit: cover;
    }

    .channel-name {
      padding: 0.2rem;
      font-weight: bold;
      text-transform: uppercase;
      text-align: center;
      font-size: 0.6rem;
    }
  </style>
</head>
